# === DO_NOT_EDIT: pkg-ext site ===
site_name: tfdo
# === OK_EDIT: pkg-ext site ===

# === DO_NOT_EDIT: pkg-ext theme ===
theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
# === OK_EDIT: pkg-ext theme ===

# === DO_NOT_EDIT: pkg-ext nav ===
nav:
  - Home: index.md
  - tfdo:
    - Overview: _root/index.md
    - CheckConfig: _root/checkconfig.md
    - TfDoSettings: _root/tfdosettings.md
    - TfDoUserConfig: _root/tfdouserconfig.md
  - boot: boot/index.md
  - config:
    - Overview: config/index.md
    - DependencyRef: config/dependencyref.md
    - S3Backend: config/s3backend.md
    - TfDoConfig: config/tfdoconfig.md
  - copy: copy/index.md
  - core: core/index.md
  - hooks: hooks/index.md
  - inspect: inspect/index.md
  - new: new/index.md
  - run: run/index.md
  - schema: schema/index.md
  - sync: sync/index.md
# === OK_EDIT: pkg-ext nav ===

# === DO_NOT_EDIT: pkg-ext extensions ===
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - admonition
  - attr_list
# === OK_EDIT: pkg-ext extensions ===
